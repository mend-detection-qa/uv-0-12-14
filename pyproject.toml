[project]
name = "exit-code-probe"
version = "0.1.0"
description = "Probe for uv 0.12.14 exit-code and diagnostic-format changes"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
crypto = [
    "cryptography>=42.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exit_code_probe"]
